<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dailymotion ভিডিও আপলোডার</title>
    <!-- Dailymotion SDK -->
    <script src="https://api.dmcdn.net/all.js"></script>
    <style>
        :root {
            --primary-color: #00aaff; /* Dailymotion Blue */
            --primary-dark: #008ecc;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-secondary: #666666;
            --border-radius: 12px;
            --success-color: #28a745;
            --error-color: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 24px;
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Auth Section */
        .auth-section {
            text-align: center;
            padding: 40px 0;
            border: 2px dashed #ddd;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-upload {
            width: 100%;
            justify-content: center;
            margin-top: 20px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* File Upload Custom Styling */
        .file-upload-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .file-upload-input {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border: 2px dashed var(--primary-color);
            border-radius: var(--border-radius);
            background-color: #f0f8ff;
            color: var(--primary-dark);
            cursor: pointer;
            transition: background 0.2s;
        }

        .file-upload-label:hover {
            background-color: #e0f0ff;
        }

        .file-info {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 20px;
            display: none; /* Hidden by default */
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--success-color);
            transition: width 0.3s ease;
        }

        .status-text {
            margin-top: 8px;
            font-size: 14px;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Logs/Messages */
        #message-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .msg-error {
            background-color: #fde8e8;
            color: var(--error-color);
            border: 1px solid #fbd5d5;
        }

        .msg-success {
            background-color: #d4edda;
            color: var(--success-color);
            border: 1px solid #c3e6cb;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Dailymotion ভিডিও আপলোডার</h1>
            <p>সরাসরি আপনার ব্রাউজার থেকে ভিডিও আপলোড করুন</p>
        </header>

        <!-- Auth Section -->
        <div id="auth-view">
            <div class="auth-section">
                <p style="margin-bottom: 15px;">ভিডিও আপলোড করার জন্য আপনাকে অবশ্যই আপনার Dailymotion অ্যাকাউন্টে লগইন করতে হবে।</p>
                <button class="btn" id="login-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Dailymotion দিয়ে লগইন করুন
                </button>
            </div>
        </div>

        <!-- Upload Form Section -->
        <div id="upload-view" class="hidden">
            <div class="form-group">
                <label for="video-file">ভিডিও ফাইল নির্বাচন করুন</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="video-file" class="file-upload-input" accept="video/*">
                    <div class="file-upload-label">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <span>ফাইল এখানে ড্র্যাগ করুন অথবা ক্লিক করুন</span>
                    </div>
                    <div id="file-name" class="file-info"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="video-title">শিরোনাম (Title)</label>
                <input type="text" id="video-title" class="form-control" placeholder="ভিডিওর শিরোনাম লিখুন...">
            </div>

            <div class="form-group">
                <label for="video-desc">বিবরণ (Description)</label>
                <textarea id="video-desc" class="form-control" placeholder="ভিডিও সম্পর্কে বিস্তারিত লিখুন..."></textarea>
            </div>

            <div class="form-group">
                <label for="video-tags">ট্যাগ (Tags)</label>
                <input type="text" id="video-tags" class="form-control" placeholder="কমা দিয়ে আলাদা করুন (যেমন: bangla, music)">
            </div>

            <div class="form-group">
                <label for="video-category">ক্যাটাগরি</label>
                <select id="video-category" class="form-control">
                    <option value="">নির্বাচন করুন</option>
                    <option value="music">সঙ্গীত</option>
                    <option value="film">চলচ্চিত্র</option>
                    <option value="tech">প্রযুক্তি</option>
                    <option value="videogames">ভিডিও গেম</option>
                    <option value="news">খবর</option>
                    <option value="sport">খেলাধুলা</option>
                    <option value="lifestyle">লাইফস্টাইল</option>
                    <option value="auto">গাড়ি</option>
                    <option value="animals">প্রাণী</option>
                    <option value="shortfilms">স্বল্পদৈর্ঘ্য চলচ্চিত্র</option>
                    <option value="travel">ভ্রমণ</option>
                </select>
            </div>

            <button id="upload-btn" class="btn btn-upload" disabled>
                <span class="btn-text">আপলোড শুরু করুন</span>
            </button>

            <!-- Progress Section -->
            <div id="progress-section" class="progress-container">
                <div class="progress-bar-bg">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
                <div id="status-text" class="status-text">প্রস্তুত হচ্ছে...</div>
            </div>

            <button id="logout-btn" class="btn" style="background-color: #6c757d; margin-top: 15px; font-size: 14px; padding: 8px 16px;">লগআউট</button>
        </div>

        <!-- Message Area -->
        <div id="message-area"></div>
    </div>

    <script>
        // API Configuration
        const API_KEY = '1656b7e3e6c4185e90ba';
        // Note: Secret is not usually used in client-side JS flow directly, 
        // but included here as requested. The SDK handles the token exchange.
        const API_SECRET = 'dc5a3d903e770c17a2340d3ede53134b4cec0d89'; 

        // DOM Elements
        const authView = document.getElementById('auth-view');
        const uploadView = document.getElementById('upload-view');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const videoFileInput = document.getElementById('video-file');
        const fileNameDisplay = document.getElementById('file-name');
        const uploadBtn = document.getElementById('upload-btn');
        const progressSection = document.getElementById('progress-section');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const messageArea = document.getElementById('message-area');

        // State
        let currentUser = null;
        let selectedFile = null;

        // Initialize Dailymotion SDK
        window.dmAsyncInit = function() {
            DM.init({
                apiKey: API_KEY,
                status: true, // check login status
                cookie: true   // enable cookies to allow the server to access the session
            });

            // Check login status on load
            DM.getLoginStatus(function(response) {
                statusChangeCallback(response);
            });
        };

        (function(d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://api.dmcdn.net/all.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'dm-jssdk'));

        // Handle Login Status
        function statusChangeCallback(response) {
            if (response.status === 'connected') {
                // Logged into your app and Dailymotion.
                currentUser = response.session;
                showUploadView();
            } else {
                // The person is not logged into your app or Dailymotion.
                currentUser = null;
                showAuthView();
            }
        }

        // Login Button Click
        loginBtn.onclick = function() {
            DM.login(function(response) {
                if (response.session) {
                    currentUser = response.session;
                    showUploadView();
                } else {
                    showMessage('লগইন ব্যর্থ হয়েছে অথবা বাতিল করা হয়েছে।', 'error');
                }
            }, {scope: 'write'}); // 'write' permission is crucial for upload
        };

        // Logout Button Click
        logoutBtn.onclick = function() {
            DM.logout(function(response) {
                showAuthView();
                resetForm();
            });
        };

        // View Switching
        function showAuthView() {
            authView.classList.remove('hidden');
            uploadView.classList.add('hidden');
        }

        function showUploadView() {
            authView.classList.add('hidden');
            uploadView.classList.remove('hidden');
            showMessage('সফলভাবে লগইন হয়েছে! অনুগ্রহ করে ফাইল নির্বাচন করুন।', 'success');
        }

        // File Input Handling
        videoFileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = `নির্বাচিত ফাইল: ${selectedFile.name} (${formatBytes(selectedFile.size)})`;
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('btn-disabled');
            } else {
                selectedFile = null;
                fileNameDisplay.textContent = '';
                uploadBtn.disabled = true;
            }
        });

        // Upload Process
        uploadBtn.onclick = function() {
            if (!selectedFile) return;

            const title = document.getElementById('video-title').value || selectedFile.name;
            const description = document.getElementById('video-desc').value || '';
            const tags = document.getElementById('video-tags').value;
            const category = document.getElementById('video-category').value;

            startUploadProcess(selectedFile, title, description, tags, category);
        };

        function startUploadProcess(file, title, description, tags, category) {
            // UI Updates
            uploadBtn.disabled = true;
            progressSection.style.display = 'block';
            progressFill.style.width = '0%';
            statusText.textContent = 'আপলোড URL পাওয়া যাচ্ছে...';

            // Step 1: Get Upload URL from Dailymotion
            DM.api('/me/videos', {
                method: 'get',
                fields: 'upload_url'
            }, function(response) {
                if (!response || !response.upload_url) {
                    handleUploadError('আপলোড URL প্রাপ্ত করতে সমস্যা হয়েছে। অনুগ্রহ করে টোকেন চেক করুন।');
                    return;
                }

                const uploadUrl = response.upload_url;
                
                // Step 2: Upload the file to the upload_url
                uploadFileToUrl(uploadUrl, file, title, description, tags, category);
            });
        }

        function uploadFileToUrl(url, file, title, description, tags, category) {
            statusText.textContent = 'সার্ভারে ফাইল পাঠানো হচ্ছে...';
            
            const xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            
            // Progress Tracking
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressFill.style.width = percentComplete + '%';
                    statusText.textContent = `আপলোড হচ্ছে... ${Math.round(percentComplete)}%`;
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200 || xhr.status === 201) {
                    try {
                        const res = JSON.parse(xhr.responseText);
                        // Step 3: Create the video object with metadata
                        createVideoObject(res.url, title, description, tags, category);
                    } catch (e) {
                        handleUploadError('সার্ভার থেকে রেসপন্স পড়তে সমস্যা হয়েছে।');
                    }
                } else {
                    handleUploadError(`আপলোড ব্যর্থ হয়েছে। HTTP Status: ${xhr.status}`);
                }
            };

            xhr.onerror = function() {
                handleUploadError('নেটওয়ার্ক এরর হয়েছে। আপনার ইন্টারনেট সংযোগ চেক করুন।');
            };

            const formData = new FormData();
            formData.append('file', file);
            xhr.send(formData);
        }

        function createVideoObject(fileUrl, title, description, tags, category) {
            statusText.textContent = 'ভিডিও তৈরি করা হচ্ছে এবং প্রকাশ করা হচ্ছে...';
            progressFill.style.width = '90%'; // Almost done visual

            const params = {
                url: fileUrl,
                title: title,
                description: description,
                published: true,
                channel: category || 'creation'
            };

            if (tags) {
                params.tags = tags;
            }

            DM.api('/me/videos', {
                method: 'post',
                args: params
            }, function(response) {
                if (response && response.id) {
                    progressFill.style.width = '100%';
                    statusText.textContent = 'সম্পূর্ণ হয়েছে!';
                    showMessage(`সফলভাবে আপলোড হয়েছে! ভিডিও আইডি: ${response.id}`, 'success');
                    resetForm();
                } else {
                    handleUploadError('ভিডিও অবজেক্ট তৈরি করতে সমস্যা হয়েছে।');
                    uploadBtn.disabled = false;
                }
            });
        }

        function handleUploadError(msg) {
            statusText.textContent = 'ব্যর্থ হয়েছে।';
            showMessage(msg, 'error');
            uploadBtn.disabled = false;
        }

        function resetForm() {
            videoFileInput.value = '';
            fileNameDisplay.textContent = '';
            document.getElementById('video-title').value = '';
            document.getElementById('video-desc').value = '';
            document.getElementById('video-tags').value = '';
            document.getElementById('video-category').value = '';
            selectedFile = null;
            uploadBtn.disabled = true;
            // Keep progress bar visible for a moment or hide it? Let's hide after delay.
            setTimeout(() => {
                if(statusText.textContent === 'সম্পূর্ণ হয়েছে!') {
                    progressSection.style.display = 'none';
                }
            }, 5000);
        }

        function showMessage(text, type) {
            messageArea.textContent = text;
            messageArea.className = ''; // reset
            messageArea.classList.add(type === 'error' ? 'msg-error' : 'msg-success');
            messageArea.style.display = 'block';
            
            // Auto hide success messages
            if (type === 'success') {
                setTimeout(() => {
                    messageArea.style.display = 'none';
                }, 8000);
            }
        }

        // Utility: Format bytes to human readable
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
